name: "Obviously Concept Scanner"
description: "Surface a codebase's distinctive technical mechanisms using a local (Ollama) or any OpenAI-compatible LLM. Engineering-only."
author: "Obviously-Not"
branding:
  icon: "search"
  color: "purple"

inputs:
  repo-path:
    description: "Path within the checked-out workspace to scan."
    required: false
    default: "."
  provider:
    description: "Inference provider (REQUIRED, no default; the Action is BYO-provider): 'ollama' (needs a self-hosted runner with Ollama) or 'openai-compatible' (a remote endpoint; the usual choice on GitHub-hosted runners, which cannot run a local LLM)."
    required: true
    default: ""
  base-url:
    description: "Endpoint base URL for provider=openai-compatible (the provider's /v1 URL). See PROVIDERS.md."
    required: false
    default: ""
  model:
    description: "Model string for the provider. Required for provider=openai-compatible (a remote model id)."
    required: false
    default: ""
  ollama-host:
    description: "Ollama host for provider=ollama (self-hosted runner). NOTE: this runs as a Docker container, so 'localhost' is the container, not the runner host; point it at the host's Ollama (e.g. http://host.docker.internal:11434, or run the job with --network host)."
    required: false
    default: "http://localhost:11434"
  api-key:
    description: "API key for a remote provider. Always pass it from a repo secret (never inline the literal key). See the README for the workflow snippet."
    required: false
    default: ""
  extra-args:
    description: 'Additional flags passed to `concept-scanner scan`, e.g. "--thorough --multi-model". Simple space-separated flags only; a value containing spaces cannot be quoted here.'
    required: false
    default: ""

# Docker action (Linux runners only). It runs the image's moving major tag, so
# `uses: ...@vN` runs the newest vN image. Each release writes this tag from
# its own version (:vN for a stable release, the exact :X.Y.Z-pre for a
# pre-release), so it names the major that release shipped. Until 2026-10-16
# it was written by hand, and v2.0.0 was published with :v1, so the @v2
# action ran the 1.3.0 image.
runs:
  using: "docker"
  image: "docker://ghcr.io/obviously-not/concept-scanner:v3"
  entrypoint: "/usr/local/bin/action-entrypoint.sh"
